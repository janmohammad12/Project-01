<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Contact Form |  Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .form-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .form-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
.form-header p {
      opacity: 0.9;
    }

    form {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .required::after {
      content: " *";
      color: red;
    }

    


input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input:valid {
      border-color: #2ecc71;
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #e74c3c;
    }
    .range-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }
input[type="range"] {
      flex: 1;
      padding: 0;
    }

    .range-value {
      min-width: 50px;
      text-align: center;
      font-weight: bold;
      color: #667eea;
    }

    input[type="color"] {
      width: 80px;
      height: 50px;
      padding: 5px;
      cursor: pointer;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    

.checkbox-group input {
      width: auto;
    }

    .checkbox-group label {
      margin: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    

.error-message {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    input:invalid:not(:placeholder-shown) + .error-message {
      display: block;
    }

    @media (max-width: 600px) {
      form {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>📬 Get in Touch</h1>
      <p>We'd love to hear from you! Fill out the form below.</p>
    </div>

    

<form action="ContactDetails.html" method="GET" id="contactForm">
      <!-- Full Name -->
	<div class="form-group">
	  <label class="required">Full Name</label>
	  <input type="text" name="fullname" placeholder="John Doe" 
			  minlength="3" maxlength="50" required>
	  <div class="error-message">Please enter your full name (min 3 characters)</div>
	</div>

	<!-- Email -->
	<div class="form-group">
	  <label class="required">Email Address</label>
	  <input type="email" name="email" placeholder="you@example.com" required>
	  <div class="error-message">Please enter a valid email address</div>
	</div>






	<!-- Phone -->
	<div class="form-group">
	  <label class="required">Phone Number</label>
	  <input type="tel" name="phone" placeholder="9876543210" 
			 pattern="[0-9]{10}" title="10-digit mobile number" required>
	  <div class="error-message">Please enter a 10-digit mobile number</div>
	</div>

	<!-- Website -->
	<div class="form-group">
	  <label>Website (Optional)</label>
	  <input type="url" name="website" placeholder="https://yourwebsite.com" required>
	</div>

	<!-- Age -->
	<div class="form-group">
	  <label class="required">Age</label>
	  <input type="number" name="age" min="18" max="100" required>
	  <div class="error-message">Age must be between 18 and 100</div>
	</div>

	<!-- Date of Birth -->
	<div class="form-group">
	  <label>Date of Birth</label>
	  <input type="date" name="dob" min="1950-01-01" max="2020-12-31" required>
	</div>

	<!-- Satisfaction Range -->
	<div class="form-group">
	  <label>Satisfaction Level: <span id="satisfaction-value">50</span>%</label>
	  <div class="range-container">
		<span>😞</span>
		<input type="range" id="satisfaction" name="satisfaction" 
			   min="0" max="100" step="1" value="50" >
		<span>😍</span>
	  </div>
	</div>

	<!-- Favorite Color -->
	<div class="form-group">
	  <label>Favorite Color</label>
	  <input type="color" name="favcolor" value="#3498db">
	</div>

	<!-- Message -->
	<div class="form-group">
	  <label class="required">Your Message</label>
	  <textarea name="message" rows="5" placeholder="Tell us what you think..." 
				 maxlength="500" required></textarea>
	  <div class="error-message">Please enter your message</div>
	</div>



	<!-- Subscribe Checkbox -->
	<div class="form-group">
	  <div class="checkbox-group">
		<input type="checkbox" name="subscribe" id="subscribe" checked>
		<label for="subscribe">Subscribe to our newsletter</label>
	  </div>
	</div>

	<!-- Submit Button -->
	<button type="submit">📤Add Student</button>
	<button type="submit" formnovalidate>📤Update Student</button>
    </form>
  </div>

  <script>
    // Live range value display
    const rangeInput = document.getElementById('satisfaction');
    if(rangeInput) {
      rangeInput.addEventListener('input', function() {
        const span = document.getElementById('satisfaction-value');
        if(span) span.textContent = this.value;
      });
    }
  </script>
</body>
</html>
